name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npm run typecheck

      - name: ESLint Verification
        run: npm run lint

      - name: Architectural Constraints Verification
        run: npm run check:constraints

      - name: Unit & Component Tests with Coverage Thresholds
        run: npm run test:coverage

      - name: Production Vite Build
        run: npm run build
